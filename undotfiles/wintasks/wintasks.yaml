# yaml-language-server: $schema=./wintasks.schema.json

- name: startup
  trigger: { type: startup, value: "00:00:01" }
  action:
    {
      command: "%LOCALAPPDATA%\\Microsoft\\WindowsApps\\pwsh.exe",
      args: '\\wsl.localhost\Ubuntu\home\username\projects\dotfiles\undotfiles\startup.ps1',
    }
  setting: { run_as: true }

- name: SyncTime
  trigger: { type: boot, value: "00:00" }
  action:
    {
      command: "%windir%\\system32\\sc.exe",
      args: "start w32time task_started",
    }
  setting: { run_as: true, logon_type: s4u }
