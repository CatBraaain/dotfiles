- brew: unzip

# Language runtimes
- brew: bun
- brew: go
- brew: node
- brew: openjdk
- brew: rustup
- run: "rustup update stable && rustup default stable"
- brew: uv

# Standalone tools
- bun: vite-plus

# deja-vu
- run: "curl -fsSL https://raw.githubusercontent.com/vshulcz/deja-vu/main/install.sh | sh"
- run: "deja install --auto"

