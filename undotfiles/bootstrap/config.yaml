# System prerequisites
- apt: flatpak
- apt: fonts-noto-cjk
- apt: libasound2t64
- apt: xvfb

# System packages
- brew: bubblewrap
- brew: coreutils
- brew: ffmpeg
- brew: gcc
- brew: git
- brew: make
- brew: powershell
- brew: socat
