<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>案C — コンテキストメニュー型</title>
    <style>
      :root {
        --bg: #181818;
        --fg: #cccccc;
        --desc: #8b8b8b;
        --hover: #2a2d2e;
        --sel: #37373d;
        --sel-fg: #e7e7e7;
        --border: #303031;
        --input-bg: #313131;
        --input-border: #3c3c3c;
        --focus: #007fd4;
        --passed: #73c991;
        --warning: #cca700;
        --radius: 9.6px;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #101010;
        color: #ccc;
        font:
          13px/1.4 "Segoe UI",
          system-ui,
          sans-serif;
      }
      .page-header {
        max-width: 1240px;
        margin: 0 auto 20px;
      }
      .page-header h1 {
        margin: 0 0 4px;
        font-size: 16px;
        color: #eee;
      }
      .page-header p {
        margin: 0;
        color: #9d9d9d;
        font-size: 12px;
      }
      .stage {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
      }
      .panel {
        margin: 0;
      }
      .panel figcaption {
        margin-top: 8px;
        color: #9d9d9d;
        font-size: 11px;
        text-align: center;
        max-width: 280px;
      }

      .sidebar {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 280px;
        height: 640px;
        padding: 12px;
        background: var(--bg);
        border-radius: 8px;
        box-shadow: 0 0 0 1px #000;
        overflow: hidden;
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        margin-bottom: 12px;
      }
      .app-header h2 {
        flex: 1;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
        line-height: 24px;
        white-space: nowrap;
      }

      .mode-toggle {
        display: flex;
        gap: 2px;
        padding: 1px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .mode-toggle button {
        height: 20px;
        padding: 0 6px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--desc);
        font-size: 10px;
        line-height: 18px;
        cursor: pointer;
      }
      .mode-toggle button.on {
        color: var(--sel-fg);
        background: var(--sel);
      }

      .list {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .group + .group {
        margin-top: 12px;
      }
      .group-header {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 24px;
      }
      .group-header.hovered {
        background: var(--hover);
        border-radius: var(--radius);
      }
      .group-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
        line-height: 20px;
      }

      .icon-btn {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--hover);
      }
      .icon-btn svg {
        width: 12px;
        height: 12px;
      }

      .row {
        position: relative;
        height: 32px;
        margin-left: 12px;
        margin-top: 4px;
        border-radius: var(--radius);
      }
      .row-main {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 32px;
        padding: 0 calc(84px + 5ch + 8px) 0 8px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        cursor: pointer;
      }
      .row-main:hover {
        background: var(--hover);
      }
      .dot {
        flex: none;
        width: 10px;
        height: 10px;
        border: 1px solid transparent;
        border-radius: 50%;
        background: var(--passed);
      }
      .dot.locked {
        background: var(--warning);
      }
      .dot.archived {
        border-color: var(--desc);
        background: transparent;
      }
      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: var(--fg);
        line-height: 20px;
        text-align: left;
      }
      .row.archived .name {
        color: var(--desc);
      }
      .ts {
        position: absolute;
        top: 50%;
        right: 84px;
        transform: translateY(-50%);
        color: var(--desc);
        font-family: var(--mono);
        font-size: 10px;
        line-height: 20px;
      }
      .row .icon-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: var(--desc);
      }
      .row .icon-btn:hover {
        color: var(--fg);
      }
      .copy {
        right: 52px;
      }
      .lockb {
        right: 28px;
      }
      .archiveb {
        right: 4px;
      }

      .footer {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .new-workspace {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        height: 32px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
      }
      .new-workspace:hover {
        background: var(--hover);
      }
      .new-workspace.open {
        background: var(--hover);
      }
      .new-workspace svg {
        width: 16px;
        height: 16px;
      }

      .workspace-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .workspace-form input {
        height: 32px;
        padding: 0 8px;
        border: 1px solid var(--input-border);
        border-radius: var(--radius);
        background: var(--input-bg);
        color: var(--fg);
        font: inherit;
      }
      .workspace-form input:focus {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .form-actions {
        display: flex;
        gap: 8px;
      }
      .add-btn {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--input-border);
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        font-size: 13px;
        cursor: pointer;
      }
      .add-btn:hover {
        background: var(--hover);
      }
      .cancel-btn {
        height: 32px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--desc);
        font-size: 13px;
        cursor: pointer;
      }
      .cancel-btn:hover {
        color: var(--fg);
      }

      .menu {
        position: absolute;
        top: 148px;
        left: 24px;
        z-index: 6;
        min-width: 190px;
        padding: 4px;
        background: #1f1f1f;
        border: 1px solid #454545;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 26px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--fg);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .menu button:hover {
        background: var(--hover);
      }
      .menu button svg {
        width: 12px;
        height: 12px;
        color: var(--desc);
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dialog {
        width: 244px;
        padding: 12px;
        background: #1f1f1f;
        border: 1px solid #454545;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .dialog h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--fg);
      }
      .dialog p {
        margin: 0 0 12px;
        font-size: 12px;
        color: #b8b8b8;
      }
      .dialog .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn-primary {
        height: 26px;
        padding: 0 12px;
        border: 0;
        border-radius: 4px;
        background: #0e639c;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      .btn-secondary {
        height: 26px;
        padding: 0 12px;
        border: 1px solid #454545;
        border-radius: 4px;
        background: transparent;
        color: var(--fg);
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
