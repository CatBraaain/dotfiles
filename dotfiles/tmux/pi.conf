set -g exit-empty off
set -g exit-unattached off
set -g destroy-unattached off
set -g default-terminal tmux-256color
set -g update-environment ""
set -g mouse on
set -g status off
set -g prefix None
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -s extended-keys on
set -sq extended-keys-format csi-u
if-shell -F '#{>=:#{version},3.0}' 'bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75'
unbind-key -n C-MouseDrag1Pane
unbind-key -n C-MouseDrag1Empty
set-hook -g session-created 'run-shell -b "#{@pi-mux-snapshot} #{q:@pi-mux-generation}"'
set-hook -g session-closed 'run-shell -b "#{@pi-mux-snapshot} #{q:@pi-mux-generation}"'
