replacements:
  - pattern: '("AfterCaptureJob"): "(CopyImageToClipboard, SaveImageToFile), UploadImageToHost"'
    replacement: '${1}: "${2}"'
  - pattern: '("AfterUploadJob"): "CopyURLToClipboard"'
    replacement: '${1}: "None"'
  - pattern: '("Hotkey"): "PrintScreen"((.*\n){1,20}.*"Job": "(RectangleRegion|ScreenRecorder|ScreenRecorderGIF)")'
    replacement: '${1}: "None"${2}'
  - pattern: '("Hotkey"): "PrintScreen"((.*\n){1,20}.*"Job": "ActiveWindow")'
    replacement: '${1}: "PrintScreen"${2}'
  - pattern: '("Hotkey"): "PrintScreen"((.*\n){1,20}.*"Job": "PrintScreen")'
    replacement: '${1}: "None"${2}'
