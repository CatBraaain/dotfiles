# dotfiles/external.build.ts syncs GitHub mirrors under ~/mirrors/github.com
# and materializes entries into dist. destination is dist-relative.
# Skill externals live in .agents/skills.exact/external.data.yaml; that hook
# sits inside .agents/, which remap.data.md removes on windows/macos, so those
# fetches only run on linux.
externalSkills:
  # gitalias.txt is materialized at dist root and renamed to .gitconfig.alias
  # by remap.data.md, which dotfiles/.gitconfig includes.
  GitAlias/gitalias:
    destination: .
    entries:
      - gitalias.txt

  rimeinn/rime-kagiroi:
    destination: rime
    entries:
      - kagiroi.manual.dict.yaml
      - kagiroi.mozc.dict.yaml
      - kagiroi.nico.dict.yaml
      - kagiroi.schema.yaml
      - kagiroi.yaml
      - kagiroi_ansikana.dict.yaml
      - kagiroi_ansikana.schema.yaml
      - kagiroi_kanji.dict.yaml
      - kagiroi_kanji.schema.yaml
      - kagiroi_kaomoji.dict.yaml
      - kagiroi_matrix.dict.yaml
      - kagiroi_matrix.schema.yaml
      - kagiroi_romaji.dict.yaml
      - kagiroi_symbols.dict.yaml
      - kagiroi_szromaji.dict.yaml
      - kagiroi_szromaji.schema.yaml
      - kagiroi.ico
      - lua
      - opencc
