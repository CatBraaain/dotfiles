read:
  - allow: "*"
  - deny:
      - "**/.env"
      - "**/.env.local"
      - "**/.env.*.local"
      - ~/.ssh
write:
  - allow:
      - .
      - ${GIT_MAIN_WORKTREE_PATH}
      - ~/.agents/worktrees/${REPOSITORY_NAME}
      - ~/.agents/tickets
      - ~/.dsh
      - ~/.pi
      - ~/.config
      - /tmp
      - ${XDG_RUNTIME_DIR}
      - ~/.npm
      - ~/.bun/install/cache
      - ~/.bun/install/global
      - ~/.local/share/pnpm/store
      - ~/.local/state/hyperframes
      - ~/.yarn/berry/cache
      - ~/.vite-plus/cache
      - ~/.vite-plus/package_manager
      # npm's global package directory when Node comes from Homebrew.
      - /home/linuxbrew/.linuxbrew/lib/node_modules
      - ~/.cache
      - ~/.camoufox
      - ~/.camofox
      - ~/.agent-browser
      - ~/.cargo/registry
      - ~/go/pkg/mod
      - ~/mirrors
  - ask:
      - ~/.agents/config
      - ~/.dsh/config
      - ~/.pi/agent/config
      - /mnt

# Auth files that bash tools need for authentication but dsh and pi fs tools
# (read/write/edit/glob/grep/find/ls) must never touch. Bound read-only into the
# bash sandbox, always denied (and masked) for fs tools. See SPEC §2.2.
credentials:
  - ~/.pi/agent/auth.json
  - ~/.dsh/.credentials.yaml
  # package registries
  - ~/.npmrc
  - ~/.bunfig.toml
  - ~/.cargo/credentials
  - ~/.cargo/credentials.toml
  - ~/.pypirc
  - ~/.gem/credentials
  - ~/.m2/settings.xml
  - ~/.gradle/gradle.properties
  - ~/.netrc
  # git over https
  - ~/.git-credentials
  - ~/.config/git/credentials
  # cloud CLIs
  - ~/.aws/credentials
  - ~/.azure/msal_token_cache.json
  - ~/.config/gcloud
  - ~/.kube/config
  - ~/.terraform.d/credentials.tfrc.json
  # tool CLIs
  - ~/.config/gh/hosts.yml
  - ~/.config/github-copilot/hosts.json
  - ~/.docker/config.json
  - ~/.vercel/auth.json
  - ~/.claude/.credentials.json
  - ~/.codex/auth.json
  # signing keys
  - ~/.gnupg

commands:
  - allow: ".*"
  - ask:
      # publish-ish action as the 2nd-4th word of any command (npm publish,
      # wxt submit, bunx --bun wxt publish, just publish, ...)
      - '^\S+( \S+){0,2} (publish|submit|upload)(\s|$)'
      - '^gh pr create(\s|$)'
      - '^git push(\s|$)'
  # destructive or privileged commands: agent must request approval with a
  # reason via ask_permission, then re-send the same bash command (SPEC §4)
  # Commands end with (\s|$), not \b: \b would also match hyphenated
  # binaries (sudo-rs), while \s alone would miss the bare command without
  # args. mkfs is the exception: its name takes suffixes (mkfs.ext4).
  - ask_with_reason:
      # git
      - '^git (reset --hard|clean -fdx?|replace|update-ref|reflog expire|gc|prune)(\s|$)'
      # system
      - '^sudo(\s|$)'
      - '^systemctl(\s|$)'
      - '^crontab(\s|$)'
      - '^(chmod|chown) -Rf?(\s|$)'
  # systemctl: read-only subcommands run without confirmation (last match wins)
  - allow:
      - '^systemctl (status|show|cat|help|get-default|show-environment)(\s|$)'
      - "^systemctl (list-|is-)"
  # power/session control, incl. via systemctl, is denied outright
  - deny:
      - '^systemctl (reboot|poweroff|halt|shutdown|suspend|hibernate|hybrid-sleep|suspend-then-hibernate|kexec|exit)(\s|$)'
  - deny:
      - '^doas(\s|$)'
      - '^(mkfs|mkfs\.ext2|mkfs\.ext3|mkfs\.ext4|mkfs\.xfs|mkfs\.btrfs|mkfs\.vfat|mkfs\.ntfs|mkfs\.exfat)\b'
      - '^(wipefs|parted|fdisk|sfdisk|sgdisk)(\s|$)'
      - '^(shutdown|reboot|poweroff|halt)(\s|$)'
  - ask:
      - '/mnt(?:/|\s|$)'
      - '(?i:(?:^|/)[^/\s]+\.(?:exe|com|bat|cmd|ps1)(?:\s|$))'
      - '(?i:^(?:powershell|pwsh|cmd|wsl|explorer|reg(?:edit)?|rundll32|mshta|cscript|wscript|schtasks)(?:\s|$))'
