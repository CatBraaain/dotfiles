read:
  - allow: "*"
  - deny:
      - "**/.env"
      - "**/.env.local"
      - "**/.env.*.local"
      - ~/.ssh
write:
  - allow:
      - .
      - ${GIT_MAIN_WORKTREE_PATH}
      - ~/.agents/worktrees/${REPOSITORY_NAME}
      - ~/.agents/work/${REPOSITORY_NAME}
      - ~/.agents/tickets
      - ~/.dsh
      - ~/.pi
      - ~/.config
      - /tmp
      - ${XDG_RUNTIME_DIR}
      - ~/.npm
      - ~/.bun/install/cache
      - ~/.bun/install/global
      - ~/.local/share/pnpm/store
      - ~/.local/share/uv
      - ~/.local/state/hyperframes
      - ~/.yarn/berry/cache
      - ~/.vite-plus/cache
      - ~/.vite-plus/package_manager
      # npm's global package directory when Node comes from Homebrew.
      - /home/linuxbrew/.linuxbrew/lib/node_modules
      - ~/.cache
      - ~/.camoufox
      - ~/.camofox
      - ~/.lazyweb
      - ~/.agent-browser
      - ~/.cargo/registry
      - ~/go/pkg/mod
      - ~/mirrors
  - ask:
      - ~/.agents/config
      - ~/.dsh/config
      - ~/.pi/agent/config
      - /mnt

# Auth files that bash tools need for authentication but dsh and pi fs tools
# (read/write/edit/glob/grep/find/ls) must never touch. Bound read-only into the
# bash sandbox, always denied (and masked) for fs tools. See SPEC §2.2.
credentials:
  - ~/.pi/agent/auth.json
  - ~/.dsh/.credentials.yaml
  # package registries
  - ~/.npmrc
  - ~/.bunfig.toml
  - ~/.cargo/credentials
  - ~/.cargo/credentials.toml
  - ~/.pypirc
  - ~/.gem/credentials
  - ~/.m2/settings.xml
  - ~/.gradle/gradle.properties
  - ~/.netrc
  # git over https
  - ~/.git-credentials
  - ~/.config/git/credentials
  # cloud CLIs
  - ~/.aws/credentials
  - ~/.azure/msal_token_cache.json
  - ~/.config/gcloud
  - ~/.kube/config
  - ~/.terraform.d/credentials.tfrc.json
  # tool CLIs
  - ~/.config/gh/hosts.yml
  - ~/.config/github-copilot/hosts.json
  - ~/.docker/config.json
  - ~/.vercel/auth.json
  - ~/.claude/.credentials.json
  - ~/.codex/auth.json
  # signing keys
  - ~/.gnupg

commands:
  - allow: { command: ".*" }
  - ask:
      - { command: ".*", args: ["publish|submit|upload"] }
      - { command: gh, args: [pr, create] }
      - { command: git, args: [push] }
  - ask_with_reason:
      - { command: git, args: [reset, "--hard"] }
      - {
          command: git,
          args: [clean, "-[^-]*f[^-]*", "-[^-]*d[^-]*", "-[^-]*x[^-]*"],
        }
      - { command: git, args: ["replace|update-ref|gc|prune"] }
      - { command: git, args: [reflog, expire] }
      - { command: sudo }
      - { command: systemctl }
      - { command: crontab }
      - { command: "chmod|chown", args: ["-[^-]*R[^-]*", "-[^-]*f[^-]*"] }
  - allow:
      - {
          command: systemctl,
          args: ["status|show|cat|help|get-default|show-environment"],
        }
      - { command: systemctl, args: ["(list-|is-).*"] }
      - { command: systemctl, args: ["--version"] }
      - { command: crontab, args: ["-l"] }
  - allow:
      - { command: sudo, args: ["-n", "true"] }
  - deny:
      - {
          command: systemctl,
          args:
            [
              "reboot|poweroff|halt|shutdown|suspend|hibernate|hybrid-sleep|suspend-then-hibernate|kexec|exit",
            ],
        }
  - deny:
      - { command: doas }
      - {
          command: '(mkfs|mkfs\.ext2|mkfs\.ext3|mkfs\.ext4|mkfs\.xfs|mkfs\.btrfs|mkfs\.vfat|mkfs\.ntfs|mkfs\.exfat)\b.*',
        }
      - { command: "wipefs|parted|fdisk|sfdisk|sgdisk" }
      - { command: "shutdown|reboot|poweroff|halt" }
  - ask:
      - { command: "(?i:/mnt(?:/.*)?)" }
  - allow:
      - {
          command: '(?i:/mnt/c/Windows/System32/(systeminfo|whoami|hostname|tasklist|netstat|nslookup|ping|tracert|nvidia-smi|where)\.exe)',
        }
      - {
          command: '(?i:/mnt/c/Windows/System32/reg\.exe)',
          args: ["(?i:query|compare)"],
        }
      - {
          command: '(?i:/mnt/c/Windows/System32/sc\.exe)',
          args: ["(?i:query|queryex|qc|qdescription|qfailure|qsidtype)"],
        }
      - {
          command: '(?i:/mnt/c/Windows/System32/schtasks\.exe)',
          args: ["(?i:/query)"],
        }
      - {
          command: '(?i:/mnt/c/Windows/System32/wevtutil\.exe)',
          args: ["(?i:qe|el)"],
        }
      - {
          command: '(?i:/mnt/c/Windows/System32/netsh\.exe)',
          args: ["(?i:show)"],
        }
      - { command: '(?i:/mnt/c/Windows/System32/ipconfig\.exe)' }
      - {
          command: '(?i:/mnt/c/Windows/System32/wsl\.exe)',
          args: ["--version|--status|-l|--list"],
        }
  - ask:
      - {
          command: '(?i:/mnt/c/Windows/System32/ipconfig\.exe)',
          args:
            ["(?i:/release6?|/renew6?|/flushdns|/registerdns|/setclassid6?)"],
        }
      - {
          command: '(?i:/mnt/c/Windows/System32/wsl\.exe)',
          args:
            [
              "--exec|-e|--shell-type|--cd|--distribution.*|-d|--distribution-id|-u|--user|--system|--debug-shell|--install|--enable-wsl1|--fixed-vhd|--from-file|--legacy|--unregister|--import|--export|--set-default.*|--set-version|--manage|--mount|--unmount|--update|--terminate|--shutdown",
            ],
        }
  - ask:
      - { command: pi }
  - allow:
      - { command: pi, args: ["--help|--version|-h|-v"] }
      - { command: pi, args: ["--list-models|list"] }
      - { command: pi, args: [mcp, list] }
