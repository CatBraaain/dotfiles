read:
  - allow: "*"
  - deny:
      - "**/.env"
      - "**/.env.local"
      - "**/.env.*.local"
      - ~/.ssh
write:
  - allow:
      - .
      - ${GIT_MAIN_WORKTREE_PATH}
      - ~/.agents/worktrees/${REPOSITORY_NAME}
      - ~/.agents/work/${REPOSITORY_NAME}
      - ~/.agents/tickets
      - ~/.pi
      - ~/.config
      - /tmp
      - ${XDG_RUNTIME_DIR}
      - ~/.npm
      - ~/.bun/install/cache
      - ~/.bun/install/global
      - ~/.local/share/pnpm/store
      - ~/.local/share/uv
      - ~/.local/state/hyperframes
      - ~/.yarn/berry/cache
      - ~/.vite-plus/cache
      - ~/.vite-plus/package_manager
      # npm's global package directory when Node comes from Homebrew.
      - /home/linuxbrew/.linuxbrew/lib/node_modules
      - ~/.cache
      - ~/.camoufox
      - ~/.camofox
      - ~/.lazyweb
      - ~/.agent-browser
      - ~/.cargo/registry
      - ~/go/pkg/mod
      - ~/mirrors
  - ask:
      - ~/.agents/config
      - ~/.pi/agent/config
      - /mnt

# Auth files that bash tools need for authentication but pi fs tools
# (read/write/edit/glob/grep/find/ls) must never touch. Bound read-only into the
# bash sandbox, always denied (and masked) for fs tools. See SPEC §2.2.
credentials:
  - ~/.pi/agent/auth.json
  # package registries
  - ~/.npmrc
  - ~/.bunfig.toml
  - ~/.cargo/credentials
  - ~/.cargo/credentials.toml
  - ~/.pypirc
  - ~/.gem/credentials
  - ~/.m2/settings.xml
  - ~/.gradle/gradle.properties
  - ~/.netrc
  # git over https
  - ~/.git-credentials
  - ~/.config/git/credentials
  # cloud CLIs
  - ~/.aws/credentials
  - ~/.azure/msal_token_cache.json
  - ~/.config/gcloud
  - ~/.kube/config
  - ~/.terraform.d/credentials.tfrc.json
  # tool CLIs
  - ~/.config/gh/hosts.yml
  - ~/.config/github-copilot/hosts.json
  - ~/.docker/config.json
  - ~/.vercel/auth.json
  - ~/.claude/.credentials.json
  - ~/.codex/auth.json
  # signing keys
  - ~/.gnupg

commands:
  # default
  - ".*":
      - allow: []

  # package manager
  - npm|pnpm|yarn|bun|deno|uv|poetry|cargo|gradle|vsce|ovsx|opam|flutter:
      - ask: [publish]
  - twine|conan|huggingface-cli:
      - ask: [upload]
  - docker|choco|gem|pod|nuget|cachix|attic:
      - ask: [push]
  - mvn|lein:
      - ask: [deploy]
  - mix:
      - ask: ["hex\\.publish"]
  - brew:
      - ask: ["bump-.*-pr|bump-unversioned-casks"]
  - komac:
      - ask: []
      - allow:
          [
            "sync|cleanup|list-versions|list|analyse|complete|autocomplete",
          ]
      - allow: [token]

  - git:
      - allow: []
      - ask: [push]
      - ask_with_reason: [reset, "--hard"]
      - ask_with_reason:
          [clean, "-[^-]*f[^-]*", "-[^-]*d[^-]*", "-[^-]*x[^-]*"]
      - ask_with_reason: ["replace|update-ref|gc|prune"]
      - ask_with_reason: [reflog, expire]
      - allow: [worktree, prune]

  - gh:
      - allow: []
      - ask: [pr, create]

  - sudo:
      - ask_with_reason: []
      - allow: ["-n", "true"]
  - doas:
      - deny: []

  - systemctl:
      - ask_with_reason: []
      - allow: ["status|show|cat|help|get-default|show-environment"]
      - allow: ["(list-|is-).*"]
      - allow: ["--version"]
      - deny:
          [
            "reboot|poweroff|halt|shutdown|suspend|hibernate|hybrid-sleep|suspend-then-hibernate|kexec|exit",
          ]

  - crontab:
      - ask_with_reason: []
      - allow: ["-l"]

  - "chmod|chown":
      - allow: []
      - ask_with_reason: ["-[^-]*R[^-]*", "-[^-]*f[^-]*"]

  # destructive system commands
  - '(mkfs|mkfs\.ext2|mkfs\.ext3|mkfs\.ext4|mkfs\.xfs|mkfs\.btrfs|mkfs\.vfat|mkfs\.ntfs|mkfs\.exfat)\b.*':
      - deny: []
  - "wipefs|parted|fdisk|sfdisk|sgdisk":
      - deny: []
  - "shutdown|reboot|poweroff|halt":
      - deny: []

  - "(?i:/mnt(?:/.*)?)":
      - ask: []
  - '(?i:/mnt/c/Windows/System32/(systeminfo|whoami|hostname|tasklist|netstat|nslookup|ping|tracert|nvidia-smi|where)\.exe)':
      - allow: []
  - '(?i:/mnt/c/Windows/System32/ipconfig\.exe)':
      - allow: []
      - ask: ["(?i:/release6?|/renew6?|/flushdns|/registerdns|/setclassid6?)"]
  - '(?i:/mnt/c/Windows/System32/reg\.exe)':
      - allow: ["(?i:query|compare)"]
  - '(?i:/mnt/c/Windows/System32/sc\.exe)':
      - allow: ["(?i:query|queryex|qc|qdescription|qfailure|qsidtype)"]
  - '(?i:/mnt/c/Windows/System32/schtasks\.exe)':
      - allow: ["(?i:/query)"]
  - '(?i:/mnt/c/Windows/System32/wevtutil\.exe)':
      - allow: ["(?i:qe|el)"]
  - '(?i:/mnt/c/Windows/System32/netsh\.exe)':
      - allow: ["(?i:show)"]
  - '(?i:/mnt/c/Windows/System32/wsl\.exe)':
      - allow: ["--version|--status|-l|--list"]
      - ask:
          [
            "--exec|-e|--shell-type|--cd|--distribution.*|-d|--distribution-id|-u|--user|--system|--debug-shell|--install|--enable-wsl1|--fixed-vhd|--from-file|--legacy|--unregister|--import|--export|--set-default.*|--set-version|--manage|--mount|--unmount|--update|--terminate|--shutdown",
          ]

  - pi:
      - ask: []
      - allow: ["--help|--version|-h|-v"]
      - allow: ["--list-models|list"]
      - allow: [mcp, list]
