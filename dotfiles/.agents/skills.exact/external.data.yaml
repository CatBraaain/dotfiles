# Destinations are relative to this folder. Remap removes it off Linux,
# so external processing (including run_after) runs on Linux only.
repos:
  DreambigOu/ELI5:
    destination: .
    entries:
      - skills/eli5
    edit_markdown:
      skills/eli5/SKILL.md:
        frontmatter:
          description: 任意の話題・コード・概念・エラーを、特定の読者層の理解度に合わせて説明する。特定の相手・読者層向けの説明依頼、平易化やELI5等の語の言及を含む説明依頼で使う。非技術者向けや理解レベルを指定した説明も対象。
        sections:
          説明の言語: |
            ユーザーが指定した言語で説明する。指定がなければユーザーの発話言語を使う。
            英語の例文は説明の粒度を示すものであり、出力言語の指定ではない。

  anthropics/skills:
    destination: .
    entries:
      - skills/doc-coauthoring
      - skills/skill-creator
    edit_markdown:
      skills/doc-coauthoring/SKILL.md:
        frontmatter:
          description: 文書・提案書・意思決定文書・PRD・設計文書・RFC・技術文書の共同執筆を支援する。構造化された文書を一緒に起草・推敲し、読者に伝わるか確認したいときに使う。SPEC.md・REQUIREMENTS.md などの正本となる仕様書では、specs と csdd に先に従う。
        sections:
          Local document workflow: |
            ツール選択・文書の配置・正本となる仕様書については、上記の特定ツールや作業ディレクトリを前提とした手順ではなく、この節に従う。

            - `SPEC.md`・`REQUIREMENTS.md` などの正本となる仕様書では、specs と csdd に先に従う。上記の「仕様書を作成する」例は、それらのワークフローを上書きしない。3段階の説明と、形式を決めずに進めるユーザーの選択肢は維持する。
            - 利用可能なファイル作成・編集ツールを使う。`create_file`・`str_replace` などの名前は操作を示すものであり、必須のツール名ではない。文書全体を再出力せず、対象箇所に絞って編集する。
            - ユーザーが指定した出力先と、プロジェクトの配置・worktree規則に従う。作業中の草稿は指定された作業ファイル領域に置き、納品文書と分ける。出力先が未確定だからといって、作業ディレクトリのルートと決めつけない。
      skills/skill-creator/SKILL.md:
        sections:
          Local authoring and evaluation: |
            ソースの配置・計測・ビューア・CLI に依存する最適化については、この節を上記の手順より優先する。

            - skill の作成・改善前に、共有用かプロジェクト専用かを確定する。導入済みコピーと決めつけて編集せず、ユーザーとプロジェクトの指示が指定する正本を編集する。一時的な評価データは `/tmp/work/<project>/`、保持する計画は指定された作業ファイル領域に置く。`<skill-name>-workspace/` はその評価ディレクトリを指すものとし、導入済みskill の隣には置かない。
            - 各実行の開始・終了時刻を呼び出し側で計測する。実測した経過秒数を `timing.json` の `total_duration_seconds` に保存する。`total_tokens` は実行環境が実値を返す場合だけ記録する。完了通知にこれらのfield が含まれると仮定しない。欠損値の推定やゼロ埋めをしない。欠けているfield とその取得元を報告する。すべての実行で必要な実測field がそろった場合だけ集計し、それ以外は合格率と取得できた計測値を別々に報告する。
            - ビューアは静的HTML として生成する: `uv run <skill-path>/eval-viewer/generate_review.py <workspace>/iteration-N --skill-name <name> --static <output.html>`。有効なベンチマークがある場合だけ `--benchmark <benchmark.json>` を追加し、2回目以降は `--previous-workspace <previous>` を追加する。HTML のパスをユーザーに渡す。ビューアサーバーの起動やブラウザの自動表示をしない。次の反復前に、保存済みの `feedback.json` を受け取る。停止するビューアサーバーは存在しない。
            - Description Optimization には、利用可能な `claude -p` 実行環境が必要である。利用できなければ自動最適化を省き、通常の評価とユーザーのフィードバックを使う。代わりに CLI を導入しない。利用できる場合は、ブラウザの起動を防ぐため最適化コマンドに `--report none` を追加し、反復結果と `best_description` JSON を提示する。発火評価HTML は `open` で開かず、保存先のパスを渡す。
            - パッケージ化では、既存の `present_files` の利用可否チェックを維持する。

  mattpocock/skills:
    destination: .
    entries:
      # - skills/*/grill-me
      - skills/*/grilling
      - skills/*/code-review
      # - skills/*/prototype
      - skills/*/diagnosing-bugs
      # - skills/*/research
      # - skills/*/tdd

    edit_markdown:
      skills/engineering/code-review/SKILL.md:
        frontmatter:
          description: 指定したコミット・ブランチ・タグ・merge-base からの変更を、コーディング規約と要求に照らしてレビューする。作業途中の変更も含め、差分・PR・コミット範囲を指定したコードレビューで使う。変更範囲を指定しない評価には review を使う。
        sections:
          Local review inputs: |
            要求の参照元の特定・差分の取得・レビュアーへの入力については、上記のセットアップ・追跡用文書・HEAD のみを扱う手順ではなく、次の手順を使う。

            1. ユーザーの依頼とプロジェクトの指示から要求の参照元を探す。不明ならユーザーに質問する。利用できないセットアップコマンドを提案しない。要求の参照元にアクセスできなければ、依頼にある次の利用可能な参照元を試す。
            2. `git rev-parse <fixed-point>` で固定点を解決する。参照が無効なら停止する。`git merge-base <fixed-point> HEAD` で比較の基点を求める。
            3. コミット済みの変更には `git diff <fixed-point>...HEAD` を使う。作業途中の変更を含む依頼では、`git diff <merge-base>` で staged・unstaged の変更を含める。`git ls-files --others --exclude-standard` で未追跡ファイルを列挙し、レビュー対象のファイルを読む。`git log <fixed-point>..HEAD --oneline` でコミットを記録する。
            4. 選択した差分と、対象に含める未追跡ファイル一覧が両方とも空の場合だけ、レビュー対象なしと報告する。その場合はレビュアーを起動しない。それ以外は、両レビュアーへ同じ要求・比較の基点・差分・対象の未追跡ファイルの内容を渡す。
      skills/engineering/diagnosing-bugs/SKILL.md:
        frontmatter:
          description: 難易度の高いバグ・性能劣化の診断ループ。診断・デバッグを求める依頼、壊れた・エラーで失敗する・遅い等の症状が報告されているタスクで使う。
      skills/productivity/grilling/SKILL.md:
        frontmatter:
          description: 前提と選択を明確にする集中的な質問で、計画・判断・アイデアを問い直す。自分の判断についての厳しい問い詰め・集中的な質問・直接の異論提示を求める依頼で使う。一般的な思考・分析・意思決定の支援には thinking-partner を使う。
        sections:
          Local question rounds: |
            上記の、現時点で回答可能な質問だけを出す進め方と質問テンプレートではなく、この手順を使う。

            独立した質問と、予測できる依存質問を同じラウンドに含める。依存質問では、候補の準備のためだけに親質問の推奨回答を仮定し、その候補を合意済みの仕様として扱わない。予測できる依存関係は可能な限り末端まで展開する。

            質問は `## 質問` の下に置き、メッセージごとに1から番号を振る。質問文自体を yes/no で答えられる形にし、推奨する選択を質問文に含める。各質問の下に `(y) はい` と、`(a)` から始まる代替案をそれぞれ別の行で示す。質問ブロックをコードフェンスで囲まない。依存質問では、番号の直後に `[1=y]` などの条件を置く。

            回答を受け取ったら、親の条件が成立した候補を確定する。条件が成立しない候補は、その子孫と回答も含めて破棄する。新たに必要になった質問は次のラウンドで尋ねる。未回答の質問や、親の回答待ちの質問がなくなるまで続ける。
  vercel-labs/skills:
    destination: .
    entries:
      - skills/find-skills
    edit_markdown:
      skills/find-skills/SKILL.md:
        frontmatter:
          description: オープンな agent skillsエコシステムからskill を探して導入する。skill の検索・導入、特定タスク向けskill の有無の確認、導入可能なskill によるagent能力の拡張をユーザーが求めたときに使う。skill の検索・導入を求めていない一般的な方法の質問やタスク依頼には使わない。
        sections:
          Local discovery and installation: |
            検索の適用範囲は frontmatter の description で判断する。上記の一般的なタスク例は、skill検索の依頼を受けた後に使う検索語の例であり、方法を尋ねる質問すべてで検索を始める理由にはしない。

            導入では、この手順を Step 6 のグローバルな `-g -y` 手順より優先する。ユーザーが導入を望んだら、取得元・導入先・導入方法を提示する。既存のskill管理方法と正本を確認し、その方法に従う。導入前に、新規依存と書き込みに必要な承認を得る。導入内容と方法が既に明示的に承認されていれば、再確認しない。グローバル導入や確認の省略を既定にしない。

