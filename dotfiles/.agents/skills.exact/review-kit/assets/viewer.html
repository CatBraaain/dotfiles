<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Recording viewer</title>
    <style>
      :root {
        --bg: #f7f8fc;
        --card: #ffffff;
        --text: #171922;
        --secondary: #495162;
        --line: #d0d5df;
        --chip: #5145cd;
        --chip-ink: #f7f8fc;
        --accent: #5145cd;
        --accent-ink: #f7f8fc;
        --shadow: rgba(23, 25, 34, 0.12);
        --sans:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans CJK JP", sans-serif;
        --mono:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK JP",
          monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --card: #171a21;
          --text: #f7f8fc;
          --secondary: #b6bdc9;
          --line: #414957;
          --chip: #5145cd;
          --chip-ink: #f7f8fc;
          --accent: #b7afff;
          --accent-ink: #171922;
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [hidden] {
        display: none !important;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 24px;
        padding: 40px 24px 64px;
      }
      .wrap {
        max-width: 1160px;
        margin: 0 auto;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 16px;
      }
      h1 {
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .meta {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 18px;
        color: var(--secondary);
        font-variant-numeric: tabular-nums;
      }
      .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 14px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        border: 1px solid var(--line);
        color: var(--secondary);
      }

      .ctl {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        line-height: 20px;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--text);
        cursor: pointer;
        transition:
          border-color 150ms,
          box-shadow 150ms;
      }
      .ctl:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .ctl:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .footnote {
        margin-top: 24px;
        font-size: 12px;
        line-height: 18px;
        color: var(--secondary);
      }

      .empty {
        max-width: 560px;
        margin: 64px auto 0;
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .empty h2 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .empty p {
        margin-top: 8px;
        font-size: 14px;
        line-height: 22px;
        color: var(--secondary);
        overflow-wrap: anywhere;
      }
      .empty code {
        font-family: var(--mono);
        font-size: 13px;
      }

      .strip-flow {
        margin-top: 24px;
        display: grid;
        gap: 10px;
      }
      .strip-flow h2 {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .strip-row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 240px;
        grid-template-rows: auto auto auto;
        column-gap: 16px;
        overflow-x: auto;
        padding: 4px 4px 12px;
      }
      .strip-item {
        display: grid;
        grid-row: span 3;
        grid-template-rows: subgrid;
        row-gap: 6px;
      }
      .caption {
        display: grid;
        grid-row: span 2;
        grid-template-rows: subgrid;
        row-gap: 2px;
        font-size: 13px;
        line-height: 18px;
        overflow-wrap: anywhere;
      }
      .caption .action {
        color: var(--text);
      }
      .caption .expected {
        color: var(--secondary);
      }
      .thumb {
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
        overflow: hidden;
        transition:
          border-color 150ms,
          box-shadow 150ms;
      }
      .thumb[aria-current="true"] {
        border-color: var(--chip);
        box-shadow: 0 0 0 1px var(--chip);
      }
      .thumb:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .thumb img,
      .thumb video {
        display: block;
        width: 238px;
        height: 134px;
        object-fit: contain;
      }
      .thumb video {
        background: #000;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background: rgba(10, 11, 15, 0.82);
      }
      .lightbox-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 12px 16px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .lightbox-caption {
        flex: 1 1 320px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        line-height: 20px;
        overflow-wrap: anywhere;
      }
      .lightbox-actions {
        display: flex;
        gap: 8px;
      }
      .lightbox-body {
        overflow: auto;
        display: grid;
        padding: 16px;
      }
      .lightbox-body img,
      .lightbox-body video {
        margin: auto;
        width: auto;
        height: auto;
      }
      .lightbox-body img {
        background: #fff;
      }
      .lightbox-body video {
        background: #000;
      }
      .lightbox-notice {
        margin: auto;
        padding: 24px;
        text-align: center;
        font-size: 14px;
        line-height: 20px;
        color: var(--secondary);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <script type="application/json" id="e2e-viewer-data">
      __E2E_VIEWER_DATA__
    </script>
    <div class="wrap">
      <header id="viewer-header" hidden>
        <h1 id="viewer-title"></h1>
        <p class="meta" id="viewer-meta"></p>
      </header>
      <div id="strip-view" hidden></div>
      <p class="footnote" id="viewer-footnote" hidden>
        This viewer is for reviewing recordings only. Read the automated test outcome from the runner
        results; do not infer it from the recordings.
      </p>
      <div class="empty" id="viewer-empty" hidden>
        <h2>Recording data not found</h2>
        <p id="empty-message"></p>
      </div>
    </div>
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Step media" hidden>
      <div class="lightbox-bar">
        <p class="lightbox-caption">
          <span class="num" id="lightbox-num"></span>
          <span id="lightbox-text"></span>
        </p>
        <div class="lightbox-actions">
          <button class="ctl" type="button" id="lightbox-prev">Previous</button>
          <button class="ctl" type="button" id="lightbox-next">Next</button>
          <button class="ctl" type="button" id="lightbox-close">Close</button>
        </div>
      </div>
      <div class="lightbox-body">
        <img id="lightbox-image" alt="" />
        <video id="lightbox-video" controls hidden></video>
        <div class="lightbox-notice" id="lightbox-notice" hidden></div>
      </div>
    </div>
    <script>
      (() => {
        const rawEl = document.getElementById("e2e-viewer-data");
        const raw = rawEl ? rawEl.textContent.trim() : "";
        let data = null;
        try {
          data = JSON.parse(raw);
        } catch {
          data = null;
        }
        const flows = data && Array.isArray(data.flows) ? data.flows : [];
        const valid =
          typeof data?.title === "string" &&
          flows.length > 0 &&
          flows.every(
            (item) =>
              item &&
              typeof item.title === "string" &&
              Array.isArray(item.steps) &&
              item.steps.length > 0,
          );

        const header = document.getElementById("viewer-header");
        const stripView = document.getElementById("strip-view");
        const footnote = document.getElementById("viewer-footnote");
        const empty = document.getElementById("viewer-empty");
        const emptyMessage = document.getElementById("empty-message");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");
        const lightboxVideo = document.getElementById("lightbox-video");
        const lightboxNum = document.getElementById("lightbox-num");
        const lightboxText = document.getElementById("lightbox-text");
        const lightboxPrev = document.getElementById("lightbox-prev");
        const lightboxNext = document.getElementById("lightbox-next");
        const lightboxClose = document.getElementById("lightbox-close");
        const lightboxNotice = document.getElementById("lightbox-notice");

        if (!valid) {
          empty.hidden = false;
          emptyMessage.textContent =
            "The contents of script#e2e-viewer-data could not be read. Embed the recording data as JSON shaped { title, flows: [{ id, title, steps: [{ number, action, video or image, expected }] }] }.";
          return;
        }

        header.hidden = false;
        stripView.hidden = false;
        footnote.hidden = false;

        const FIRST_FRAME_FRAGMENT = "#t=0.001";
        let lightboxStep = null;
        let lastThumb = null;
        const stripRows = [];

        function el(tag, className, textContent) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (textContent !== undefined) node.textContent = textContent;
          return node;
        }

        function renderHeader() {
          const totalSteps = flows.reduce((sum, item) => sum + item.steps.length, 0);
          document.getElementById("viewer-title").textContent = data.title || "Recording viewer";
          document.getElementById("viewer-meta").textContent =
            `${flows.length} flows · ${totalSteps} steps`;
        }

        function buildStepItem(step, flowIndex, index) {
          const itemEl = el("figure", "strip-item");
          const caption = el("figcaption", "caption");
          caption.append(el("span", "action", step.action ?? ""));
          if (step.expected) caption.append(el("span", "expected", step.expected));
          const thumb = el("button", "thumb");
          thumb.type = "button";
          const label = `Step ${step.number ?? index + 1}: ${step.action}`;
          if (step.video !== undefined) {
            const video = el("video");
            video.preload = "metadata";
            video.src = `${step.video}${FIRST_FRAME_FRAGMENT}`;
            thumb.setAttribute("aria-label", label);
            thumb.append(video);
          } else {
            const img = el("img");
            img.src = step.image ?? "";
            img.alt = label;
            img.loading = "lazy";
            thumb.append(img);
          }
          thumb.addEventListener("click", () => openLightbox(flowIndex, index));
          itemEl.append(thumb, caption);
          return itemEl;
        }

        function renderStrips() {
          stripView.textContent = "";
          flows.forEach((item, flowIndex) => {
            const section = el("section", "strip-flow");
            const heading = el("h2");
            heading.append(
              el("span", "", item.title),
              el("span", "meta", `${item.steps.length} steps`),
            );
            const row = el("div", "strip-row");
            const thumbs = item.steps.map((step, index) => {
              const itemEl = buildStepItem(step, flowIndex, index);
              row.append(itemEl);
              return itemEl.querySelector(".thumb");
            });
            section.append(heading, row);
            stripView.append(section);
            stripRows.push(thumbs);
          });
        }

        function setLightboxStep(flowIndex, index) {
          lightboxStep = { flowIndex, index };
          const step = flows[flowIndex].steps[index];
          lightboxVideo.pause();
          lightboxNotice.hidden = true;
          const isVideo = step.video !== undefined;
          lightboxImage.hidden = isVideo;
          lightboxVideo.hidden = !isVideo;
          if (isVideo) {
            lightboxVideo.src = step.video;
            lightboxImage.removeAttribute("src");
          } else {
            lightboxImage.src = step.image ?? "";
            lightboxImage.alt = `Step ${step.number ?? index + 1}: ${step.action}`;
            lightboxVideo.removeAttribute("src");
            lightboxVideo.load();
          }
          lightboxNum.textContent = String(step.number ?? index + 1);
          lightboxText.textContent = step.expected
            ? `${step.action} — ${step.expected}`
            : (step.action ?? "");
          lightboxPrev.disabled = index === 0;
          lightboxNext.disabled = index === flows[flowIndex].steps.length - 1;
          markCurrentThumb(flowIndex, index);
        }

        function markCurrentThumb(flowIndex, index) {
          stripRows.forEach((thumbs, rowIndex) => {
            thumbs.forEach((thumb, thumbIndex) => {
              thumb.setAttribute(
                "aria-current",
                String(rowIndex === flowIndex && thumbIndex === index),
              );
            });
          });
          const thumb = stripRows[flowIndex]?.[index];
          if (!thumb) return;
          lastThumb = thumb;
          thumb.scrollIntoView({ block: "nearest", inline: "nearest" });
        }

        function moveLightbox(delta) {
          if (!lightboxStep) return;
          const index = lightboxStep.index + delta;
          if (index < 0 || index >= flows[lightboxStep.flowIndex].steps.length) return;
          setLightboxStep(lightboxStep.flowIndex, index);
        }

        function openLightbox(flowIndex, index) {
          setLightboxStep(flowIndex, index);
          lightbox.hidden = false;
          lightboxClose.focus();
        }

        function closeLightbox() {
          lightbox.hidden = true;
          lightboxVideo.pause();
          if (lastThumb) lastThumb.focus();
        }

        function trapLightboxFocus(event) {
          const focusables = [...lightbox.querySelectorAll("button, video")].filter(
            (node) => !node.disabled && !node.hidden,
          );
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (!lightbox.contains(document.activeElement)) {
            event.preventDefault();
            first.focus();
          } else if (document.activeElement === last && !event.shiftKey) {
            event.preventDefault();
            first.focus();
          } else if (document.activeElement === first && event.shiftKey) {
            event.preventDefault();
            last.focus();
          }
        }

        function showLightboxNotice() {
          lightboxImage.hidden = true;
          lightboxVideo.hidden = true;
          lightboxNotice.textContent =
            "Could not load the media. Check that the file exists relative to index.html.";
          lightboxNotice.hidden = false;
        }

        window.addEventListener("keydown", (event) => {
          if (lightbox.hidden) return;
          const onVideo = document.activeElement === lightboxVideo;
          if (onVideo && (event.key === "ArrowLeft" || event.key === "ArrowRight")) return;
          if (event.key === "ArrowLeft") moveLightbox(-1);
          else if (event.key === "ArrowRight") moveLightbox(1);
          else if (event.key === "Escape") closeLightbox();
          else if (event.key === "Tab") trapLightboxFocus(event);
        });

        lightboxPrev.addEventListener("click", () => moveLightbox(-1));
        lightboxNext.addEventListener("click", () => moveLightbox(1));
        lightboxClose.addEventListener("click", closeLightbox);
        lightboxImage.addEventListener("error", showLightboxNotice);
        lightboxVideo.addEventListener("error", showLightboxNotice);

        renderHeader();
        renderStrips();
      })();

    </script>
  </body>
</html>
