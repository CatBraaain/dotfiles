name: kagiroi_dotfiles_romaji
rows:
  "": [あ, い, う, え, お]
  l: [ぁ, ぃ, ぅ, ぇ, ぉ]
  k: [か, き, く, け, こ]
  c: [か, き, く, け, こ]
  g: [が, ぎ, ぐ, げ, ご]
  s: [さ, し, す, せ, そ]
  z: [ざ, じ, ず, ぜ, ぞ]
  t: [た, ち, つ, て, と]
  d: [だ, ぢ, づ, で, ど]
  n: [な, に, ぬ, ね, の]
  h: [は, ひ, ふ, へ, ほ]
  b: [ば, び, ぶ, べ, ぼ]
  p: [ぱ, ぴ, ぷ, ぺ, ぽ]
  m: [ま, み, む, め, も]
  y: [や, "", ゆ, いぇ, よ]
  ly: [ゃ, "", ゅ, "", ょ]
  r: [ら, り, る, れ, ろ]
  w: [わ, うぃ, "", うぇ, を]
  q: [くぁ, くぃ, "", くぇ, くぉ]
  j: [じゃ, じ, じゅ, じぇ, じょ]
  f: [ふぁ, ふぃ, ふ, ふぇ, ふぉ]
  v: [ヴぁ, ヴぃ, ヴ, ヴぇ, ヴぉ]
singles:
  nn: ん
  mm: ん
  dhu: でゅ
  who: うぉ
  wyi: ゐ
  wye: ゑ
  ltu: っ
  lwa: ゎ
  lka: ヵ
  lke: ヶ
families:
  - rows: [k, c, g, s, z, t, d, n, h, b, p, m, r]
    column: i
    suffixes: { ya: ゃ, yu: ゅ, yo: ょ, ha: ゃ, hu: ゅ, ho: ょ }
    exclude: ["nh.*", "hh.*", "dhu"]
  - rows: [t, d]
    column: e
    suffixes: { hi: ぃ }
  - rows: [k, c, g, s, t]
    column: i
    suffixes: { he: ぇ }
  - rows: [k, c, g, s, z, t, d, h, b, r]
    column: u
    suffixes: { wa: ぁ, wi: ぃ, we: ぇ, wo: ぉ }
  - rows: [k, c, g, s, z, t, d, h, b, r]
    column: o
    suffixes: { wu: ぅ }
conditionals:
  - from: [l, k, c, g, s, z, t, d, h, b, p, y, r, w, q, f, j, v]
    when_before: [$same]
    to: っ
  - { from: [k], when_before: [c], to: っ }
  - { from: [c], when_before: [k], to: っ }
  - from: [n, m]
    when_before: [b, c, d, f, g, h, j, k, l, m, n, p, q, r, s, t, v, w, x, z]
    to: ん
  - from: [n, m]
    when_before: [$convert]
    to: ん
postroma:
  - replace:
      んんあ: んな
      んんい: んに
      んんう: んぬ
      んんえ: んね
      んんお: んの
long_vowel: "-"
