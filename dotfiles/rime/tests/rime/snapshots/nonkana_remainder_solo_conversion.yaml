scenario: nonkana_remainder_solo_conversion
cases:
  - name: 第一候補への変換
    input: kanji{SPACE}
    display: 感じ
  - name: 削除する候補の選択
    input: kanji{SPACE}{SPACE}
    display: 漢字
    candidates: [感じ, 漢字, 幹事, かんじ, 監事, カンジ, 寛治, 幹二, 莞爾, 完治]
  - name: 漢字候補の末尾削除
    input: kanji{SPACE}{SPACE}{BACKSPACE}
    display: 漢
  - name: 漢字残部の単独変換
    input: kanji{SPACE}{SPACE}{BACKSPACE}{SPACE}
    display: 漢
  - name: 漢字残部の単一候補
    input: kanji{SPACE}{SPACE}{BACKSPACE}{SPACE}{SPACE}
    display: 漢
    candidates: [漢]
  - name: 漢字残部の確定
    input: kanji{SPACE}{SPACE}{BACKSPACE}{SPACE}{SPACE}{RETURN}
    commit: 漢

  - name: カタカナへの変換
    input: kana{HENKAN}
    display: カナ
  - name: カタカナの末尾削除
    input: kana{HENKAN}{BACKSPACE}
    display: カ
  - name: カタカナ残部の単独変換
    input: kana{HENKAN}{BACKSPACE}{SPACE}
    display: カ
  - name: カタカナ残部の単一候補
    input: kana{HENKAN}{BACKSPACE}{SPACE}{SPACE}
    display: カ
    candidates: [カ]
  - name: カタカナ残部の確定
    input: kana{HENKAN}{BACKSPACE}{SPACE}{SPACE}{RETURN}
    commit: カ
