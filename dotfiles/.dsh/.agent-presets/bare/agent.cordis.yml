# The bare agent preset composes the agent-plane rows the Web bundle disables
# and no dotfiles plugin replaces: workspace instructions, skills, web, and
# compaction. Model-facing fs/bash tools come from the Web profile's host
# plugins (dotfiles-sandboxed-tools); agents.yaml controls which global
# plugin tools each agent may use.

# Web disables the host copy of this row so presets own workspace instructions.
- id: agent-instructions
  name: "@deepseek-ai/dsh-agent-instructions"
  config:
    maxBytes: 65536

# Web disables the host copies of these rows so presets own local skill
# discovery and the model-facing catalog/loader. Both register into this
# preset's layer of the host skill registry, so they need no realm.
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"

- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"

# Web disables the host copy of this row so presets own the model-facing web
# tools. The `web` service and its search/fetch providers stay in the host
# composition (dotfiles-dsh-web-search registers the usable providers), so
# this row needs no realm.
- id: tool-web
  name: "@deepseek-ai/dsh-tool-web"
  config:
    fetch: true
    searchTimeoutMs: 60000

# Same group as the shipped standard preset: `compaction-basic` reads
# `toolResultPrune` through `ctx.get`, so the pruner must share this realm
# rather than sit outside it. `tokenMeter` is deliberately NOT in this realm:
# the meter stays on the HOST plane, and the rows here resolve that one
# instance.
- id: compaction
  name: "cordis:group"
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: "@deepseek-ai/dsh-compaction-basic"

    - id: command-compact
      name: "@deepseek-ai/dsh-command-compact"

    - id: tool-result-pruner
      name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
