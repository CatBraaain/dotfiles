# The bare agent preset adds no model-facing tools. The Web profile's host
# plugins provide the available tool implementations; agents.yaml controls
# which global plugin tools each agent may use.

# Web disables the host copy of this row so presets own workspace instructions.
- id: agent-instructions
  name: "@deepseek-ai/dsh-agent-instructions"
  config:
    maxBytes: 65536

# Web disables the host copies of these rows so presets own local skill
# discovery and the model-facing catalog/loader. Both register into this
# preset's layer of the host skill registry, so they need no realm.
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"

- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"
