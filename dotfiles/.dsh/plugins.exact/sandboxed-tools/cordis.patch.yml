# Bundle patch layer for dotfiles-sandboxed-tools.
# Joined into the profile when this package is listed in dsh.profile.bundles.
#
# This plugin registers the complete replacement tool set. The Web bundle
# disables the stock model-facing fs/bash rows, while the bare agent preset
# does not mount them in the agent plane. This patch keeps the native
# observation policy disabled because sandboxed-tools owns read-before-write
# observations independently (SPEC §1・§2.4).
- id: fs-observation-policy
  name: "@deepseek-ai/dsh-fs-observation-policy"
  disabled: true
- insert:
    - id: sandboxed-tools
      name: dotfiles-sandboxed-tools
