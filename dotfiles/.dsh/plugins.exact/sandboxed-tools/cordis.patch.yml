# Bundle patch layer for dotfiles-sandboxed-tools.
# Joined into the profile when this package is listed in dsh.profile.bundles.
#
# This plugin replaces the stock fs/bash model-facing tools: the stock rows
# are disabled here and this plugin registers read/write/edit/glob/grep/ls/bash
# plus ask_permission itself (SPEC §1・§3: it is the single
# registrar, so the replacement is complete once the plugin loads). Row
# addressing is by id with last write winning per row.
- id: tool-bash
  name: "@deepseek-ai/dsh-tool-bash"
  disabled: true
- id: fs-observation-policy
  name: "@deepseek-ai/dsh-fs-observation-policy"
  disabled: true
- id: tool-fs
  name: "@deepseek-ai/dsh-tool-fs"
  disabled: true
- id: tool-fs-search
  name: "@deepseek-ai/dsh-tool-fs-search"
  disabled: true
- insert:
    - id: sandboxed-tools
      name: dotfiles-sandboxed-tools
