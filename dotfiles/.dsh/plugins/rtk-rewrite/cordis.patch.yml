# Bundle patch layer for dotfiles-rtk-rewrite.
# Joined into the profile when this package is listed in dsh.profile.bundles.
#
# Swaps the POSIX bash executor for the rtk-rewriting subclass in this
# package: the stock `bash-sandbox` row is disabled by an id-level override
# (later bundle patches win per row), and this package mounts as `bash-rtk`
# with the same config shape. Windows rows are untouched (`pwsh-sandbox`
# keeps serving; `bash-rtk` is gated off there like the stock row).
- id: bash-sandbox
  disabled: true

- insert:
    - id: bash-rtk
      name: dotfiles-rtk-rewrite
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000
