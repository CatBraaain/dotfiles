rules:
  - provider: zai
    model: glm-5.3
    # z.ai peak hours 14:00-18:00 (UTC+8) => 06:00-10:00 UTC
    when: 'd=$(date -u +%u); h=$(date -u +%H); ! { [ "$d" -le 5 ] && [ "$h" -ge 06 ] && [ "$h" -lt 10 ]; }'
  - provider: zai
    model: glm-5.2
  - provider: commandcode
    model: deepseek/deepseek-v4-flash
  - provider: openai-codex
    model: gpt-5.6-luna
  - provider: deepseek
    model: deepseek-v4-flash
