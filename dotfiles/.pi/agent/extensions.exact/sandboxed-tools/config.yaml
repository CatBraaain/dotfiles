read:
  - {allow: "*"}
  - deny:
      - "**/.env"
      - "**/.env.local"
      - "**/.env.*.local"
      - ~/.ssh
      - ~/.pi/agent/auth.json

write:
  - allow:
      - .
      - ${GIT_MAIN_WORKTREE_PATH}
      - ${GIT_MAIN_WORKTREE_PATH}-worktrees
      - ~/.pi
      - ~/.config
      - /tmp
      - ${XDG_RUNTIME_DIR}
      - ~/.npm
      - ~/.bun/install/cache
      - ~/.local/share/pnpm/store
      - ~/.yarn/berry/cache
      - ~/.vite-plus/cache
      - ~/.vite-plus/package_manager
      - ~/.cache
      - ~/.camoufox
      - ~/.agent-browser
      - ~/.cargo/registry
      - ~/go/pkg/mod
      - ~/mirrors
  - {deny: ~/.pi/agent/extensions/sandboxed-tools/config.yaml}

credentials: []

commands:
  - {allow: "*"}
  - ask:
      - "{npm,bun,pnpm} publish"
      - gh pr create
      # git
      - git reset --hard
      - git clean -fd
      # - git push {--force,-f,--delete,-d}
      - git push
      - git replace
      - git update-ref
      - git reflog expire
      - git gc
      - git prune
      # system
      - systemctl
      - crontab
      - chmod -R
      - chown -R
      - sudo
  # systemctl: read-only subcommands run without confirmation (last match wins)
  - allow:
      - systemctl status
      - systemctl show
      - systemctl cat
      - systemctl help
      - systemctl list-*
      - systemctl is-*
      - systemctl get-default
      - systemctl show-environment
  # power/session control, incl. via systemctl, is denied outright
  - deny:
      - systemctl reboot
      - systemctl poweroff
      - systemctl halt
      - systemctl shutdown
      - systemctl suspend
      - systemctl hibernate
      - systemctl hybrid-sleep
      - systemctl suspend-then-hibernate
      - systemctl kexec
      - systemctl exit
  - deny:
      - doas
      - "{mkfs,mkfs.ext2,mkfs.ext3,mkfs.ext4,mkfs.xfs,mkfs.btrfs,mkfs.vfat,mkfs.ntfs,mkfs.exfat}"
      - "{wipefs,parted,fdisk,sfdisk,sgdisk}"
      - "{shutdown,reboot,poweroff,halt}"
