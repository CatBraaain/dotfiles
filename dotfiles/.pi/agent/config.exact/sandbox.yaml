read:
  - allow: "*"
  - deny:
      - "**/.env"
      - "**/.env.local"
      - "**/.env.*.local"
      - ~/.ssh
      - ~/.pi/agent/auth.json

write:
  - allow:
      - .
      - ${GIT_MAIN_WORKTREE_PATH}
      - ~/projects/worktrees/${REPOSITORY_NAME}
      - ~/.pi
      - ~/.config
      - /tmp
      - ${XDG_RUNTIME_DIR}
      - ~/.npm
      - ~/.bun/install/cache
      - ~/.bun/install/global
      - ~/.local/share/pnpm/store
      - ~/.yarn/berry/cache
      - ~/.vite-plus/cache
      - ~/.vite-plus/package_manager
      # npm's global package directory when Node comes from Homebrew.
      - /home/linuxbrew/.linuxbrew/lib/node_modules
      - ~/.cache
      - ~/.camoufox
      - ~/.camofox
      - ~/.agent-browser
      - ~/.cargo/registry
      - ~/go/pkg/mod
      - ~/mirrors
  - { deny: ~/.pi/agent/config/sandbox.yaml }

credentials: []

commands:
  - allow: ".*"
  - ask:
      - '^(npm|bun|pnpm) publish\b'
      - '^gh pr create\b'
      - '^git push\b'
  # destructive or privileged commands: agent must request approval with a
  # reason via ask_permission, then re-send the same bash command (SPEC §4)
  - ask_with_reason:
      # git
      - '^git (reset --hard|clean -fd|replace|update-ref|reflog expire|gc|prune)\b'
      # system
      - '^sudo\b'
      - '^systemctl\b'
      - '^crontab\b'
      - '^(chmod|chown) -R\b'
  # systemctl: read-only subcommands run without confirmation (last match wins)
  # (\s|$) so only the enumerated subcommands are allowed, not hyphen variants
  - allow:
      - '^systemctl (status|show|cat|help|get-default|show-environment)(\s|$)'
      - "^systemctl (list-|is-)"
  # power/session control, incl. via systemctl, is denied outright
  - deny:
      - '^systemctl (reboot|poweroff|halt|shutdown|suspend|hibernate|hybrid-sleep|suspend-then-hibernate|kexec|exit)\b'
  - deny:
      - '^doas\b'
      - '^(mkfs|mkfs\.ext2|mkfs\.ext3|mkfs\.ext4|mkfs\.xfs|mkfs\.btrfs|mkfs\.vfat|mkfs\.ntfs|mkfs\.exfat)\b'
      - '^(wipefs|parted|fdisk|sfdisk|sgdisk)\b'
      - '^(shutdown|reboot|poweroff|halt)\b'
